<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>视频提取器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: #8888aa;
      --accent-blue: #6366f1;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* 背景装饰 */
    .bg-glow {
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 16px;
      position: relative;
      z-index: 1;
    }

    /* 头部 */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .platform-tags {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .platform-tag {
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 13px;
      transition: all 0.3s;
    }

    .platform-tag:hover {
      border-color: var(--accent-blue);
      background: rgba(99, 102, 241, 0.1);
    }

    /* 输入区域 */
    .input-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      flex-direction: column;
    }

    @media (min-width: 640px) {
      .input-wrapper {
        flex-direction: row;
      }
    }

    .url-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    .url-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .url-input::placeholder {
      color: var(--text-secondary);
    }

    .extract-btn {
      padding: 12px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .extract-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    }

    .extract-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* 进度条 */
    .progress-bar {
      height: 3px;
      background: var(--bg-secondary);
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
      display: none;
    }

    .progress-bar.active {
      display: block;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
      border-radius: 2px;
      animation: loading 1.5s ease-in-out infinite;
    }

    @keyframes loading {
      0% { width: 0%; margin-left: 0; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }

    /* 结果卡片 */
    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
      animation: fadeInUp 0.4s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .video-preview {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .video-preview video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .video-info {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .info-item .label {
      color: var(--text-primary);
      font-weight: 600;
    }

    .info-item .value {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-download {
      flex: 1;
      min-width: 120px;
      padding: 12px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-download:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
    }

    .btn-secondary-action {
      flex: 1;
      min-width: 120px;
      padding: 12px 20px;
      border-radius: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary-action:hover {
      border-color: var(--accent-blue);
      background: rgba(99, 102, 241, 0.1);
    }

    /* Toast 提示 */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
      pointer-events: auto;
      backdrop-filter: blur(10px);
      max-width: 90vw;
      text-align: center;
    }

    .toast.success {
      background: rgba(16, 185, 129, 0.9);
      color: white;
    }

    .toast.error {
      background: rgba(239, 68, 68, 0.9);
      color: white;
    }

    .toast.info {
      background: rgba(99, 102, 241, 0.9);
      color: white;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; }
      to { opacity: 0; transform: translateY(-10px); }
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* 配置弹窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal h3 {
      margin-bottom: 16px;
      font-size: 18px;
    }

    .modal label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .modal input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }

    .modal input:focus {
      border-color: var(--accent-blue);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .modal-actions button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    .modal-actions .btn-cancel {
      background: var(--bg-primary);
      color: var(--text-secondary);
    }

    .modal-actions .btn-save {
      background: var(--accent-blue);
      color: white;
    }

    /* 顶部工具栏 */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .toolbar-title {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .settings-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.3s;
    }

    .settings-btn:hover {
      border-color: var(--accent-blue);
      color: var(--text-primary);
    }

    /* 加载动画 */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  
  <div class="toast-container" id="toastContainer"></div>

  <!-- 配置弹窗 -->
  <div class="modal-overlay" id="configModal">
    <div class="modal">
      <h3>⚙️ Supabase 配置</h3>
      <label>Project URL</label>
      <input type="text" id="supabaseUrl" placeholder="https://xxxx.supabase.co">
      <label>Public Key</label>
      <input type="password" id="supabaseKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeConfig()">取消</button>
        <button class="btn-save" onclick="saveConfig()">保存</button>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <h1>🎬 视频提取器</h1>
      <p>输入视频链接，一键提取、下载</p>
      <div class="platform-tags">
        <span class="platform-tag">抖音</span>
        <span class="platform-tag">B站</span>
        <span class="platform-tag">小红书</span>
        <span class="platform-tag">快手</span>
      </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <span class="toolbar-title">纯前端版 · 无后端</span>
      <button class="settings-btn" onclick="openConfig()">⚙️ 配置</button>
    </div>

    <!-- 输入区域 -->
    <div class="input-section">
      <div class="input-wrapper">
        <input type="text" class="url-input" id="urlInput" 
               placeholder="粘贴抖音/B站/小红书/快手视频分享链接..." 
               onkeypress="if(event.key==='Enter')extract()">
        <button class="extract-btn" id="extractBtn" onclick="extract()">
          <span id="btnText">提取视频</span>
        </button>
      </div>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <!-- 结果区域 -->
    <div id="resultArea"></div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState">
      <div class="icon">📥</div>
      <p>输入视频链接开始提取</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ========== 配置 ==========
    let SUPABASE_URL = localStorage.getItem('sb_url') || '';
    let SUPABASE_KEY = localStorage.getItem('sb_key') || '';
    let supabase = null;

    function initSupabase() {
      if (!SUPABASE_URL || !SUPABASE_KEY) {
        openConfig();
        showToast('请先配置 Supabase 项目', 'info');
        return false;
      }
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        return true;
      } catch (e) {
        showToast('Supabase 初始化失败: ' + e.message, 'error');
        return false;
      }
    }

    function openConfig() {
      document.getElementById('supabaseUrl').value = SUPABASE_URL;
      document.getElementById('supabaseKey').value = SUPABASE_KEY;
      document.getElementById('configModal').classList.add('active');
    }

    function closeConfig() {
      document.getElementById('configModal').classList.remove('active');
    }

    function saveConfig() {
      SUPABASE_URL = document.getElementById('supabaseUrl').value.trim();
      SUPABASE_KEY = document.getElementById('supabaseKey').value.trim();
      localStorage.setItem('sb_url', SUPABASE_URL);
      localStorage.setItem('sb_key', SUPABASE_KEY);
      closeConfig();
      if (initSupabase()) {
        showToast('配置已保存', 'success');
      }
    }

    // ========== Toast ==========
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ========== 平台检测 ==========
    function detectPlatform(url) {
      if (url.includes('douyin.com') || url.includes('v.douyin.com')) return 'douyin';
      if (url.includes('bilibili.com') || url.includes('b23.tv')) return 'bilibili';
      if (url.includes('xiaohongshu.com') || url.includes('xhs.link')) return 'xiaohongshu';
      if (url.includes('kuaishou.com') || url.includes('ks.com')) return 'kuaishou';
      return null;
    }

    // ========== 提取视频 ==========
    async function extract() {
      const urlInput = document.getElementById('urlInput');
      const url = urlInput.value.trim();
      
      if (!url) {
        showToast('请输入视频链接', 'error');
        return;
      }

      const platform = detectPlatform(url);
      if (!platform) {
        showToast('暂不支持该平台，请检查链接', 'error');
        return;
      }

      // UI 状态
      const btn = document.getElementById('extractBtn');
      const btnText = document.getElementById('btnText');
      const progressBar = document.getElementById('progressBar');
      const emptyState = document.getElementById('emptyState');
      
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> 提取中...';
      progressBar.classList.add('active');
      emptyState.style.display = 'none';

      try {
        if (!initSupabase()) throw new Error('未配置 Supabase');

        // 调用 Supabase Edge Function
        const { data, error } = await supabase.functions.invoke('video-extract', {
          body: { url, platform }
        });

        if (error) {
          throw new Error(error.message || '提取失败');
        }

        if (data.success && data.video) {
          renderResult(data.video);
          showToast('视频提取成功！', 'success');
        } else {
          showToast(data.message || '提取失败', 'error');
          emptyState.style.display = 'block';
        }
      } catch (e) {
        showToast(e.message || '网络错误，请检查连接', 'error');
        emptyState.style.display = 'block';
      } finally {
        btn.disabled = false;
        btnText.textContent = '提取视频';
        progressBar.classList.remove('active');
      }
    }

    // ========== 渲染结果 ==========
    function renderResult(video) {
      const area = document.getElementById('resultArea');
      area.innerHTML = `
        <div class="result-card">
          <div class="video-preview">
            <video controls poster="${video.thumbnail || ''}">
              <source src="${video.downloadUrl}" type="video/mp4">
              您的浏览器不支持视频播放
            </video>
          </div>
          
          <div class="video-info">
            <div class="info-item">
              <span class="label">标题:</span>
              <span class="value">${video.title}</span>
            </div>
            <div class="info-item">
              <span class="label">时长:</span>
              <span class="value">${video.duration || '-'}</span>
            </div>
            <div class="info-item">
              <span class="label">分辨率:</span>
              <span class="value">${video.resolution || '-'}</span>
            </div>
            <div class="info-item">
              <span class="label">帧率:</span>
              <span class="value">${video.fps || '-'}</span>
            </div>
          </div>

          <div class="action-buttons">
            <button class="btn-download" onclick="downloadVideo('${video.downloadUrl}', '${video.title}')">
              ⬇️ 下载视频
            </button>
            <button class="btn-secondary-action" onclick="copyLink()">
              🔗 复制链接
            </button>
          </div>
        </div>
      `;
    }

    // ========== 下载视频 ==========
    function downloadVideo(url, title) {
      // 创建临时链接下载
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title}.mp4`;
      a.target = '_blank';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('开始下载...', 'success');
    }

    // ========== 复制链接 ==========
    function copyLink() {
      navigator.clipboard.writeText(window.location.href)
        .then(() => showToast('链接已复制', 'success'))
        .catch(() => showToast('复制失败', 'error'));
    }

    // ========== 初始化 ==========
    (function init() {
      if (SUPABASE_URL && SUPABASE_KEY) {
        initSupabase();
      }
    })();
  </script>
</body>
</html>
