<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频提取器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            secondary: '#8b5cf6',
            success: '#10b981',
            danger: '#ef4444',
          },
          animation: {
            'spin': 'spin 1s linear infinite',
            'fadeIn': 'fadeIn 0.5s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .input-glow:focus { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      transition: all 0.3s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      transition: all 0.3s ease;
    }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3); }
    .loading-bar { animation: loading 1.5s ease-in-out infinite; }
    @keyframes loading { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
    .toast { animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { 0% { transform: translateX(100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body class="text-white">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="text-center mb-10 animate-fadeIn">
      <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-indigo-400 via-purple-400 to-cyan-400 bg-clip-text text-transparent mb-3">
        🎬 视频提取器
      </h1>
      <p class="text-gray-400 text-base md:text-lg mb-4">
        粘贴分享链接，一键提取下载
      </p>
      <div class="flex justify-center gap-3 flex-wrap">
        <span class="px-3 py-1.5 rounded-full bg-white/5 border border-gray-700 text-gray-400 text-sm">抖音</span>
        <span class="px-3 py-1.5 rounded-full bg-white/5 border border-gray-700 text-gray-400 text-sm">B站</span>
        <span class="px-3 py-1.5 rounded-full bg-white/5 border border-gray-700 text-gray-400 text-sm">小红书</span>
        <span class="px-3 py-1.5 rounded-full bg-white/5 border border-gray-700 text-gray-400 text-sm">快手</span>
      </div>
    </div>

    <!-- Input -->
    <div class="glass-card rounded-2xl p-4 md:p-6 mb-6 animate-fadeIn">
      <textarea
        id="urlInput"
        placeholder="粘贴抖音视频分享链接（支持从App复制的完整文本）..."
        class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-gray-700 text-white placeholder-gray-500 focus:outline-none input-glow resize-none"
        rows="3"
        onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); extractVideo(); }"
      ></textarea>
      <button
        onclick="extractVideo()"
        id="extractBtn"
        class="btn-primary w-full py-3 rounded-xl text-white font-semibold flex items-center justify-center gap-2 mt-3"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        提取视频
      </button>
      <div id="loadingBar" class="mt-3 h-1 bg-gray-700 rounded-full overflow-hidden hidden">
        <div class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 loading-bar"></div>
      </div>
    </div>

    <!-- Result -->
    <div id="videoResult" class="hidden animate-fadeIn">
      <div class="glass-card rounded-2xl p-4 md:p-6 mb-6">
        <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden mb-4">
          <video controls class="w-full h-full object-contain" id="videoPlayer"></video>
        </div>

        <div class="flex flex-wrap gap-3 mb-4 p-3 bg-white/5 rounded-xl text-sm">
          <div class="flex-1 min-w-[200px]">
            <span class="text-gray-400">标题:</span>
            <span class="text-white ml-1" id="videoTitle">--</span>
          </div>
          <div>
            <span class="text-gray-400">时长:</span>
            <span class="text-white ml-1" id="videoDuration">--:--</span>
          </div>
          <div>
            <span class="text-gray-400">分辨率:</span>
            <span class="text-white ml-1" id="videoResolution">--</span>
          </div>
        </div>

        <div class="flex gap-3">
          <button onclick="downloadVideo()" class="btn-success flex-1 py-3 rounded-xl text-white font-semibold flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            下载视频
          </button>
          <button onclick="copyLink()" class="px-6 py-3 rounded-xl bg-white/10 text-white font-semibold flex items-center gap-2 hover:bg-white/20 transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            复制
          </button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>
  </div>

  <script>
    let currentVideo = null;

    function extractUrlFromText(text) {
      const urlPattern = /https?:\/\/[^\s,，。！!？?]+/g;
      const matches = text.match(urlPattern);
      if (matches) {
        for (const match of matches) {
          const cleanUrl = match.replace(/[，。！!？?]$/, '');
          if (detectPlatform(cleanUrl)) return cleanUrl;
        }
        return matches[0].replace(/[，。！!？?]$/, '');
      }
      return text;
    }

    function detectPlatform(url) {
      if (url.includes('douyin') || url.includes('v.douyin') || url.includes('iesdouyin')) return 'douyin';
      if (url.includes('bilibili') || url.includes('b23')) return 'bilibili';
      if (url.includes('xiaohongshu') || url.includes('xhs.link')) return 'xiaohongshu';
      if (url.includes('kuaishou') || url.includes('ks.com')) return 'kuaishou';
      return null;
    }

    function formatDuration(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast px-4 py-3 rounded-xl shadow-lg ${
        type === 'success' ? 'bg-green-500/90' : 
        type === 'error' ? 'bg-red-500/90' : 'bg-blue-500/90'
      } text-white font-semibold text-sm`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    async function extractVideo() {
      const inputText = document.getElementById('urlInput').value.trim();
      if (!inputText) { showToast('请输入视频链接', 'error'); return; }

      const url = extractUrlFromText(inputText);
      const platform = detectPlatform(url);
      if (!platform) { showToast('暂不支持该平台', 'error'); return; }

      const btn = document.getElementById('extractBtn');
      const loadingBar = document.getElementById('loadingBar');
      const result = document.getElementById('videoResult');

      btn.disabled = true;
      btn.innerHTML = '<span class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin inline-block"></span> 提取中...';
      loadingBar.classList.remove('hidden');
      result.classList.add('hidden');

      try {
        const response = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });
        const data = await response.json();

        if (data.success && data.video) {
          currentVideo = data.video;
          displayVideo(currentVideo);
          showToast('✅ 视频提取成功！', 'success');
        } else {
          showToast('❌ ' + (data.message || '提取失败'), 'error');
        }
      } catch (error) {
        showToast('❌ 无法连接服务器', 'error');
        console.error(error);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 提取视频';
        loadingBar.classList.add('hidden');
      }
    }

    function displayVideo(video) {
      const result = document.getElementById('videoResult');
      const player = document.getElementById('videoPlayer');
      player.src = video.downloadUrl;
      document.getElementById('videoTitle').textContent = video.title || '视频';
      document.getElementById('videoDuration').textContent = video.duration || '--:--';
      document.getElementById('videoResolution').textContent = video.resolution || '--';
      result.classList.remove('hidden');
    }

    function downloadVideo() {
      if (!currentVideo) return;
      const link = document.createElement('a');
      link.href = currentVideo.downloadUrl;
      link.download = `${currentVideo.title || 'video'}.mp4`;
      link.target = '_blank';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('开始下载...', 'success');
    }

    function copyLink() {
      if (currentVideo) {
        navigator.clipboard.writeText(currentVideo.downloadUrl).then(() => {
          showToast('链接已复制', 'success');
        }).catch(() => showToast('复制失败', 'error'));
      }
    }
  </script>
</body>
</html>
