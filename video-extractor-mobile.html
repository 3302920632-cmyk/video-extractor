<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>视频提取器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .input-glow:focus {
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      transition: all 0.3s ease;
    }
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
    }
    .loading-spinner {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .toast {
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      0% { transform: translateX(100%); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    .platform-tag {
      transition: all 0.3s ease;
    }
    .platform-tag:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.5);
    }
  </style>
</head>
<body class="text-white p-4">
  <div class="max-w-lg mx-auto">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-400 via-purple-400 to-cyan-400 bg-clip-text text-transparent mb-3">
        🎬 视频提取器
      </h1>
      <p class="text-gray-400 text-sm">
        粘贴链接，一键保存喜欢的视频
      </p>
      <div class="flex justify-center gap-2 mt-4 flex-wrap">
        <span class="platform-tag px-3 py-1 rounded-full bg-white/5 border border-gray-700 text-gray-400 text-xs">抖音</span>
        <span class="platform-tag px-3 py-1 rounded-full bg-white/5 border border-gray-700 text-gray-400 text-xs">B站</span>
        <span class="platform-tag px-3 py-1 rounded-full bg-white/5 border border-gray-700 text-gray-400 text-xs">小红书</span>
        <span class="platform-tag px-3 py-1 rounded-full bg-white/5 border border-gray-700 text-gray-400 text-xs">快手</span>
      </div>
    </div>

    <div class="glass-card rounded-2xl p-4 mb-4">
      <textarea
        id="urlInput"
        placeholder="粘贴抖音、B站等平台的分享链接..."
        class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-gray-700 text-white placeholder-gray-500 focus:outline-none input-glow resize-none"
        rows="3"
        onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); extractVideo(); }"
      ></textarea>
      <button
        onclick="extractVideo()"
        id="extractBtn"
        class="btn-primary w-full py-3 rounded-xl text-white font-semibold flex items-center justify-center gap-2 mt-3"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        提取视频
      </button>
      <div id="loadingBar" class="mt-3 h-1 bg-gray-700 rounded-full overflow-hidden hidden">
        <div class="h-full bg-gradient-to-r from-indigo-500 to-purple-500" style="width: 0%; animation: loading 1.5s ease-in-out infinite;"></div>
      </div>
      <style>@keyframes loading { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }</style>
    </div>

    <div id="videoResult" class="hidden">
      <div class="glass-card rounded-2xl p-4 mb-4">
        <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden mb-4">
          <video controls class="w-full h-full object-contain" id="videoPlayer"></video>
        </div>

        <div class="flex flex-wrap gap-2 mb-4 p-3 bg-white/5 rounded-xl text-sm">
          <div class="flex items-center gap-2 text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span class="text-gray-400 truncate max-w-[150px]" id="videoTitle">加载中...</span>
          </div>
          <div class="flex items-center gap-2 text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="text-gray-400" id="videoDuration">--:--</span>
          </div>
          <div class="flex items-center gap-2 text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            <span class="text-gray-400" id="videoResolution">--</span>
          </div>
        </div>

        <div class="flex gap-2">
          <button onclick="downloadVideo()" class="btn-success flex-1 py-3 rounded-xl text-white font-semibold flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            下载视频
          </button>
          <button onclick="copyDownloadLink()" class="btn-secondary flex-1 py-3 rounded-xl text-white font-semibold flex items-center justify-center gap-2 bg-white/10 hover:bg-white/15">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            复制链接
          </button>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>
  </div>

  <script>
    let currentVideo = null;

    const VIDEO_APIS = [
      { url: 'https://api.muxiaoguo.cn/api/video11', param: 'url' },
      { url: 'https://api.258666.net/api/video', param: 'url' },
      { url: 'https://api.vvhan.com/api/video', param: 'url' },
      { url: 'https://apione.apibyte.cn/api/video6', param: 'url' },
    ];

    function extractUrlFromText(text) {
      const urlPattern = /https?:\/\/[^\s,，。！!？?]+/g;
      const matches = text.match(urlPattern);
      if (matches) {
        for (const match of matches) {
          const cleanUrl = match.replace(/[，。！!？?]$/, '');
          if (detectPlatform(cleanUrl)) {
            return cleanUrl;
          }
        }
        return matches[0].replace(/[，。！!？?]$/, '');
      }
      return text;
    }

    function detectPlatform(url) {
      if (url.includes('douyin') || url.includes('tiktok') || url.includes('v.douyin')) return 'douyin';
      if (url.includes('bilibili') || url.includes('b23') || url.includes('bilibili.com')) return 'bilibili';
      if (url.includes('xiaohongshu') || url.includes('xhs') || url.includes('xiaohongshu.com')) return 'xiaohongshu';
      if (url.includes('kuaishou') || url.includes('ks') || url.includes('kuaishou.com')) return 'kuaishou';
      return null;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast px-4 py-3 rounded-xl shadow-lg text-sm ${
        type === 'success' ? 'bg-green-500/90' : 
        type === 'error' ? 'bg-red-500/90' : 
        type === 'info' ? 'bg-blue-500/90' : 'bg-gray-500/90'
      } text-white font-semibold`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    async function extractVideo() {
      const inputText = document.getElementById('urlInput').value.trim();
      if (!inputText) {
        showToast('请输入视频链接', 'error');
        return;
      }

      const url = extractUrlFromText(inputText);
      
      if (url !== inputText) {
        document.getElementById('urlInput').value = url;
        showToast('已自动提取链接', 'info');
      }

      const platform = detectPlatform(url);
      if (!platform) {
        showToast('暂不支持该平台', 'error');
        return;
      }

      const extractBtn = document.getElementById('extractBtn');
      const loadingBar = document.getElementById('loadingBar');
      const videoResult = document.getElementById('videoResult');

      extractBtn.disabled = true;
      extractBtn.innerHTML = '<span class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full loading-spinner"></span>提取中...';
      loadingBar.classList.remove('hidden');
      videoResult.classList.add('hidden');

      try {
        let videoData = null;

        const serverUrl = 'http://localhost:3000/api/extract';
        
        try {
          const response = await fetch(serverUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
            timeout: 30000,
          });
          const data = await response.json();
          if (data.success && data.video) {
            videoData = data.video;
          }
        } catch (e) {
          console.log('Server API failed, trying third-party APIs...');
        }

        if (!videoData) {
          for (const api of VIDEO_APIS) {
            try {
              const response = await fetch(`${api.url}?${api.param}=${encodeURIComponent(url)}`, {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                },
                timeout: 10000,
              });
              const data = await response.json();
              
              if (data.success || data.code === 200 || data.code === 1) {
                const result = data.data || data;
                if (result.video_url || result.playUrl || result.url || result.video) {
                  videoData = {
                    title: result.title || result.desc || result.name || '视频',
                    downloadUrl: result.video_url || result.playUrl || result.url || result.video,
                    thumbnail: result.cover_url || result.cover || result.image || '',
                    duration: result.duration || '01:00',
                    resolution: result.resolution || '1080p',
                    platform: platform,
                  };
                  break;
                }
              }
            } catch (e) {
              console.log('API failed:', api.url, e);
            }
          }
        }

        if (!videoData && platform === 'douyin') {
          videoData = await extractWithDouyinDirect(url);
        }

        if (!videoData && platform === 'douyin') {
          videoData = await extractWithDouyinAPI(url);
        }

        if (videoData) {
          currentVideo = videoData;
          displayVideo(videoData);
          showToast('视频提取成功！', 'success');
        } else {
          showToast('提取失败，请重试或更换链接', 'error');
        }
      } catch (error) {
        console.error('提取失败:', error);
        showToast('提取失败，请检查网络连接', 'error');
      } finally {
        extractBtn.disabled = false;
        extractBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>提取视频';
        loadingBar.classList.add('hidden');
      }
    }

    async function extractWithDouyinDirect(url) {
      try {
        const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
        const html = await response.text();
        
        const urlMatch = html.match(/playAddr["']?\s*[:=]\s*["']([^"']+)["']/);
        if (urlMatch) {
          return {
            title: '抖音视频',
            downloadUrl: urlMatch[1],
            thumbnail: '',
            duration: '01:00',
            resolution: '1080p',
            platform: 'douyin',
          };
        }
        
        const videoTagMatch = html.match(/<video[^>]*src=["']([^"']+)["']/);
        if (videoTagMatch) {
          return {
            title: '抖音视频',
            downloadUrl: videoTagMatch[1],
            thumbnail: '',
            duration: '01:00',
            resolution: '1080p',
            platform: 'douyin',
          };
        }
      } catch (e) {
        console.log('Direct extraction failed:', e);
      }
      return null;
    }

    async function extractWithDouyinAPI(url) {
      try {
        const videoId = url.match(/v\.douyin\.com\/([^\/]+)/);
        if (videoId) {
          const apiUrl = 'https://www.douyin.com/aweme/v1/web/aweme/detail/?aweme_id=' + videoId[1];
          const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(apiUrl));
          const data = await response.json();
          
          if (data.aweme_detail && data.aweme_detail.video) {
            const video = data.aweme_detail.video;
            const playAddr = video.play_addr || video.download_addr;
            if (playAddr && playAddr.url_list && playAddr.url_list.length > 0) {
              return {
                title: data.aweme_detail.desc || '抖音视频',
                downloadUrl: playAddr.url_list[0],
                thumbnail: video.cover && video.cover.url_list ? video.cover.url_list[0] : '',
                duration: data.aweme_detail.duration ? formatDuration(data.aweme_detail.duration) : '01:00',
                resolution: '1080p',
                platform: 'douyin',
              };
            }
          }
        }
      } catch (e) {
        console.log('Douyin API extraction failed:', e);
      }
      return null;
    }

    function formatDuration(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
    }

    function displayVideo(video) {
      const videoResult = document.getElementById('videoResult');
      const videoPlayer = document.getElementById('videoPlayer');
      
      videoPlayer.src = video.downloadUrl;
      
      document.getElementById('videoTitle').textContent = video.title;
      document.getElementById('videoDuration').textContent = video.duration || '01:00';
      document.getElementById('videoResolution').textContent = video.resolution || '1080p';
      
      videoResult.classList.remove('hidden');
    }

    function downloadVideo() {
      if (!currentVideo) return;
      const link = document.createElement('a');
      link.href = currentVideo.downloadUrl;
      link.download = `${currentVideo.title}.mp4`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('开始下载视频...', 'success');
    }

    function copyDownloadLink() {
      if (!currentVideo) return;
      navigator.clipboard.writeText(currentVideo.downloadUrl).then(() => {
        showToast('下载链接已复制', 'success');
      }).catch(() => {
        showToast('复制失败，请手动复制', 'error');
      });
    }
  </script>
</body>
</html>
